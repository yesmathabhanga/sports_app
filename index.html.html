<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aerion 2K26 Sports Campaign</title>
    <!-- React & Tailwind CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            body { background: white; }
            .print-hidden { display: none !important; }
            .print-shadow-none { box-shadow: none !important; }
            .print-bg-transparent { background-color: transparent !important; }
            .print-text-black { color: black !important; }
            .print-p-2 { padding: 0.5rem !important; }
            .print-text-gray-800 { color: #1f2937 !important; }
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const AerionSports = () => {
            const [activeTab, setActiveTab] = useState('public');
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
            const [pinInput, setPinInput] = useState('');
            
            const sportsData = {
                'Sub Junior': {
                    Boys: ['Race 50 MTR', 'Musical Chair', 'Toffee Collection', 'Balloon Breaking', 'Gift Passing', 'Basketing'],
                    Girls: ['Race 50 MTR', 'Musical Chair', 'Toffee Collection', 'Balloon Breaking', 'Gift Passing', 'Basketing']
                },
                'Junior': {
                    Boys: ['Race 100 MTR', 'Lemon Collecting', 'Sack Race', 'Musical Chair', 'Water Filling', 'Balloon Blasting', 'Balloon Breaking'],
                    Girls: ['Race 100 MTR', 'Lemon Collecting', 'Sack Race', 'Musical Chair', 'Water Filling', 'Balloon Blasting', 'Balloon Breaking']
                },
                'Senior': {
                    Boys: ['Race 200 MTR', 'Balloon Blasting', 'Sack Race', 'Arm Wrestling', 'Shootout', 'Lemon Collecting', 'Basketing', 'Slow Race'],
                    Girls: ['Race 100 MTR', 'Sack Race', 'Lemon Spoon', 'Balloon Blasting', 'Basketing', 'Lemon Collecting', 'Skipping']
                },
                'General Items': {
                    All: ['Relay', 'Tug of War']
                }
            };

            const studentClasses = ['Nursery', 'LKG', 'UKG', '1st', '2nd', '3rd', '4th'];
            const teams = ['NIL', 'Red Warriors', 'Blue Titans'];

            const [scores, setScores] = useState({ 'Red Warriors': 0, 'Blue Titans': 0 });
            const [results, setResults] = useState([]);

            const [selectedCategory, setSelectedCategory] = useState('');
            const [selectedGroup, setSelectedGroup] = useState('');
            const [selectedGame, setSelectedGame] = useState('');
            
            const [firstPlaceTeam, setFirstPlaceTeam] = useState('NIL');
            const [firstPlaceName, setFirstPlaceName] = useState('');
            const [firstPlaceClass, setFirstPlaceClass] = useState('');

            const [secondPlaceTeam, setSecondPlaceTeam] = useState('NIL');
            const [secondPlaceName, setSecondPlaceName] = useState('');
            const [secondPlaceClass, setSecondPlaceClass] = useState('');

            const [thirdPlaceTeam, setThirdPlaceTeam] = useState('NIL');
            const [thirdPlaceName, setThirdPlaceName] = useState('');
            const [thirdPlaceClass, setThirdPlaceClass] = useState('');

            const handleLogin = () => {
                if (pinInput === '268393') { setIsAdminLoggedIn(true); setPinInput(''); } 
                else { alert('Incorrect PIN'); }
            };

            const handleSubmitResult = (e) => {
                e.preventDefault();
                if (!selectedCategory || !selectedGroup || !selectedGame) {
                    alert('Please select category, group and game!'); return;
                }

                const newResult = {
                    id: Date.now(),
                    category: selectedCategory, group: selectedGroup, game: selectedGame,
                    firstTeam: firstPlaceTeam, firstName: firstPlaceName, firstClass: firstPlaceClass,
                    secondTeam: secondPlaceTeam, secondName: secondPlaceName, secondClass: secondPlaceClass,
                    thirdTeam: thirdPlaceTeam, thirdName: thirdPlaceName, thirdClass: thirdPlaceClass,
                    timestamp: new Date().toLocaleTimeString()
                };

                const updatedScores = { ...scores };
                if (firstPlaceTeam !== 'NIL') updatedScores[firstPlaceTeam] += 10;
                if (secondPlaceTeam !== 'NIL') updatedScores[secondPlaceTeam] += 7;
                if (thirdPlaceTeam !== 'NIL') updatedScores[thirdPlaceTeam] += 5;

                setScores(updatedScores);
                setResults([newResult, ...results]);

                setSelectedGame('');
                setFirstPlaceTeam('NIL'); setFirstPlaceName(''); setFirstPlaceClass('');
                setSecondPlaceTeam('NIL'); setSecondPlaceName(''); setSecondPlaceClass('');
                setThirdPlaceTeam('NIL'); setThirdPlaceName(''); setThirdPlaceClass('');
                alert('Result Added Successfully!');
            };

            const handleDeleteResult = (id) => {
                if (window.confirm("ഈ റിസൾട്ട് ഡിലീറ്റ് ചെയ്യണോ?")) {
                    const resultToDelete = results.find(res => res.id === id);
                    if (resultToDelete) {
                        const updatedScores = { ...scores };
                        if (resultToDelete.firstTeam !== 'NIL') updatedScores[resultToDelete.firstTeam] -= 10;
                        if (resultToDelete.secondTeam !== 'NIL') updatedScores[resultToDelete.secondTeam] -= 7;
                        if (resultToDelete.thirdTeam !== 'NIL') updatedScores[resultToDelete.thirdTeam] -= 5;
                        
                        setScores(updatedScores);
                        setResults(results.filter(res => res.id !== id));
                    }
                }
            };

            const handleResetAll = () => {
                if (window.confirm("തീർച്ചയായും എല്ലാ സ്കോറുകളും റിസൾട്ടുകളും പൂർണ്ണമായും മായ്‌ക്കണോ?")) {
                    setScores({ 'Red Warriors': 0, 'Blue Titans': 0 });
                    setResults([]);
                }
            };

            return (
                <div className="min-h-screen p-4 font-sans">
                    <div className="max-w-4xl mx-auto bg-white rounded-lg shadow-md overflow-hidden print-shadow-none print-bg-transparent">
                        
                        <div className="bg-blue-900 text-white text-center p-6 print-text-black print-bg-transparent print-p-2">
                            <h1 className="text-3xl font-bold uppercase tracking-wider">YES SPORTS 2K-26</h1>
                            <h2 className="text-xl mt-2 font-semibold text-yellow-400 print-text-gray-800">AERION SPORTS CAMPAIGN</h2>
                        </div>

                        <div className="flex border-b print-hidden">
                            <button className={`flex-1 py-3 font-semibold ${activeTab === 'public' ? 'bg-blue-100 text-blue-800 border-b-2 border-blue-800' : 'text-gray-600'}`} onClick={() => setActiveTab('public')}>Public View</button>
                            <button className={`flex-1 py-3 font-semibold ${activeTab === 'admin' ? 'bg-blue-100 text-blue-800 border-b-2 border-blue-800' : 'text-gray-600'}`} onClick={() => setActiveTab('admin')}>Admin Panel</button>
                        </div>

                        <div className="p-6">
                            {/* ================= PUBLIC VIEW ================= */}
                            {activeTab === 'public' && (
                                <div className="space-y-8">
                                    <div className="flex justify-between items-center gap-4 text-center">
                                        <div className="bg-red-100 border-2 border-red-500 rounded-xl p-6 w-1/2 shadow-lg">
                                            <h3 className="text-xl md:text-2xl font-bold text-red-700 uppercase">Red Warriors</h3>
                                            <p className="text-4xl md:text-5xl font-black text-red-600 mt-4">{scores['Red Warriors']}</p>
                                        </div>
                                        <div className="text-2xl font-black text-gray-400">VS</div>
                                        <div className="bg-blue-100 border-2 border-blue-500 rounded-xl p-6 w-1/2 shadow-lg">
                                            <h3 className="text-xl md:text-2xl font-bold text-blue-700 uppercase">Blue Titans</h3>
                                            <p className="text-4xl md:text-5xl font-black text-blue-600 mt-4">{scores['Blue Titans']}</p>
                                        </div>
                                    </div>

                                    <div>
                                        <div className="flex justify-between items-center mb-4">
                                            <h3 className="text-xl font-bold border-b-2 border-gray-300 pb-2">Recent Results</h3>
                                            {results.length > 0 && (
                                                <button onClick={() => window.print()} className="bg-green-600 text-white px-4 py-2 rounded shadow hover:bg-green-700 print-hidden text-sm font-semibold">
                                                    🖨️ Export to PDF
                                                </button>
                                            )}
                                        </div>
                                        {results.length === 0 ? <p className="text-gray-500 text-center py-8">No results published yet.</p> : (
                                            <div className="space-y-4">
                                                {results.map(res => (
                                                    <div key={res.id} className="bg-gray-50 p-4 rounded-lg border border-gray-200">
                                                        <div className="flex justify-between text-sm text-gray-500 mb-2">
                                                            <span className="font-bold text-gray-700">{res.category} - {res.group}</span>
                                                        </div>
                                                        <h4 className="text-lg font-bold text-gray-800 mb-3 uppercase">{res.game}</h4>
                                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
                                                            <div className="bg-yellow-100 p-2 rounded border border-yellow-300">
                                                                <span className="text-xs font-bold text-yellow-700">🥇 1st (10 Pts)</span>
                                                                <div className="font-semibold">{res.firstTeam !== 'NIL' ? res.firstTeam : 'No Winner'}</div>
                                                                <div className="text-sm text-gray-700">{res.firstName} {res.firstClass && <span className="font-bold">({res.firstClass})</span>}</div>
                                                            </div>
                                                            <div className="bg-gray-200 p-2 rounded border border-gray-300">
                                                                <span className="text-xs font-bold text-gray-600">🥈 2nd (7 Pts)</span>
                                                                <div className="font-semibold">{res.secondTeam !== 'NIL' ? res.secondTeam : 'No Winner'}</div>
                                                                <div className="text-sm text-gray-700">{res.secondName} {res.secondClass && <span className="font-bold">({res.secondClass})</span>}</div>
                                                            </div>
                                                            <div className="bg-orange-100 p-2 rounded border border-orange-300">
                                                                <span className="text-xs font-bold text-orange-800">🥉 3rd (5 Pts)</span>
                                                                <div className="font-semibold">{res.thirdTeam !== 'NIL' ? res.thirdTeam : 'No Winner'}</div>
                                                                <div className="text-sm text-gray-700">{res.thirdName} {res.thirdClass && <span className="font-bold">({res.thirdClass})</span>}</div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* ================= ADMIN PANEL ================= */}
                            {activeTab === 'admin' && (
                                <div className="print-hidden">
                                    {!isAdminLoggedIn ? (
                                        <div className="max-w-sm mx-auto text-center py-10">
                                            <h3 className="text-lg font-semibold mb-4">Admin Login</h3>
                                            <input type="password" placeholder="Enter PIN (1234)" className="border p-2 rounded w-full mb-4 text-center text-lg" value={pinInput} onChange={(e) => setPinInput(e.target.value)} />
                                            <button onClick={handleLogin} className="bg-blue-600 text-white px-6 py-2 rounded font-bold w-full hover:bg-blue-700">LOGIN</button>
                                        </div>
                                    ) : (
                                        <div className="space-y-8">
                                            {/* ADD RESULT FORM */}
                                            <div className="bg-gray-50 p-6 rounded-lg border">
                                                <h3 className="text-xl font-bold mb-6 text-gray-800 border-b pb-2">Update Match Result</h3>
                                                <form onSubmit={handleSubmitResult} className="space-y-6">
                                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 bg-white p-4 rounded shadow-sm border">
                                                        <div>
                                                            <label className="block text-sm font-bold text-gray-700 mb-1">Category</label>
                                                            <select className="w-full border p-2 rounded" value={selectedCategory} onChange={(e) => { setSelectedCategory(e.target.value); setSelectedGroup(''); setSelectedGame(''); }}>
                                                                <option value="">-- Select --</option>
                                                                {Object.keys(sportsData).map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                                            </select>
                                                        </div>
                                                        <div>
                                                            <label className="block text-sm font-bold text-gray-700 mb-1">Group</label>
                                                            <select className="w-full border p-2 rounded" value={selectedGroup} onChange={(e) => { setSelectedGroup(e.target.value); setSelectedGame(''); }} disabled={!selectedCategory}>
                                                                <option value="">-- Select --</option>
                                                                {selectedCategory && Object.keys(sportsData[selectedCategory]).map(grp => <option key={grp} value={grp}>{grp}</option>)}
                                                            </select>
                                                        </div>
                                                        <div>
                                                            <label className="block text-sm font-bold text-gray-700 mb-1">Game</label>
                                                            <select className="w-full border p-2 rounded" value={selectedGame} onChange={(e) => setSelectedGame(e.target.value)} disabled={!selectedGroup}>
                                                                <option value="">-- Select --</option>
                                                                {selectedGroup && sportsData[selectedCategory][selectedGroup].map(game => <option key={game} value={game}>{game}</option>)}
                                                            </select>
                                                        </div>
                                                    </div>

                                                    <div className="space-y-4">
                                                        {/* 1st Place */}
                                                        <div className="flex flex-col md:flex-row gap-4 bg-yellow-50 p-4 rounded border border-yellow-200">
                                                            <div className="w-full md:w-1/3">
                                                                <label className="block text-sm font-bold text-yellow-800 mb-1">🥇 1st Place</label>
                                                                <select className="w-full border p-2 rounded bg-white" value={firstPlaceTeam} onChange={(e) => setFirstPlaceTeam(e.target.value)}>
                                                                    {teams.map(t => <option key={t} value={t}>{t}</option>)}
                                                                </select>
                                                            </div>
                                                            <div className="w-full md:w-1/3">
                                                                <label className="block text-sm font-bold text-yellow-800 mb-1">Name</label>
                                                                <input type="text" className="w-full border p-2 rounded" placeholder="Student name..." value={firstPlaceName} onChange={(e) => setFirstPlaceName(e.target.value)} disabled={firstPlaceTeam === 'NIL'} />
                                                            </div>
                                                            <div className="w-full md:w-1/3">
                                                                <label className="block text-sm font-bold text-yellow-800 mb-1">Class</label>
                                                                <select className="w-full border p-2 rounded bg-white" value={firstPlaceClass} onChange={(e) => setFirstPlaceClass(e.target.value)} disabled={firstPlaceTeam === 'NIL'}>
                                                                    <option value="">-Select Class-</option>
                                                                    {studentClasses.map(c => <option key={c} value={c}>{c}</option>)}
                                                                </select>
                                                            </div>
                                                        </div>

                                                        {/* 2nd Place */}
                                                        <div className="flex flex-col md:flex-row gap-4 bg-gray-100 p-4 rounded border border-gray-300">
                                                            <div className="w-full md:w-1/3">
                                                                <label className="block text-sm font-bold text-gray-700 mb-1">🥈 2nd Place</label>
                                                                <select className="w-full border p-2 rounded bg-white" value={secondPlaceTeam} onChange={(e) => setSecondPlaceTeam(e.target.value)}>
                                                                    {teams.map(t => <option key={t} value={t}>{t}</option>)}
                                                                </select>
                                                            </div>
                                                            <div className="w-full md:w-1/3">
                                                                <label className="block text-sm font-bold text-gray-700 mb-1">Name</label>
                                                                <input type="text" className="w-full border p-2 rounded" placeholder="Student name..." value={secondPlaceName} onChange={(e) => setSecondPlaceName(e.target.value)} disabled={secondPlaceTeam === 'NIL'} />
                                                            </div>
                                                            <div className="w-full md:w-1/3">
                                                                <label className="block text-sm font-bold text-gray-700 mb-1">Class</label>
                                                                <select className="w-full border p-2 rounded bg-white" value={secondPlaceClass} onChange={(e) => setSecondPlaceClass(e.target.value)} disabled={secondPlaceTeam === 'NIL'}>
                                                                    <option value="">-Select Class-</option>
                                                                    {studentClasses.map(c => <option key={c} value={c}>{c}</option>)}
                                                                </select>
                                                            </div>
                                                        </div>

                                                        {/* 3rd Place */}
                                                        <div className="flex flex-col md:flex-row gap-4 bg-orange-50 p-4 rounded border border-orange-200">
                                                            <div className="w-full md:w-1/3">
                                                                <label className="block text-sm font-bold text-orange-800 mb-1">🥉 3rd Place</label>
                                                                <select className="w-full border p-2 rounded bg-white" value={thirdPlaceTeam} onChange={(e) => setThirdPlaceTeam(e.target.value)}>
                                                                    {teams.map(t => <option key={t} value={t}>{t}</option>)}
                                                                </select>
                                                            </div>
                                                            <div className="w-full md:w-1/3">
                                                                <label className="block text-sm font-bold text-orange-800 mb-1">Name</label>
                                                                <input type="text" className="w-full border p-2 rounded" placeholder="Student name..." value={thirdPlaceName} onChange={(e) => setThirdPlaceName(e.target.value)} disabled={thirdPlaceTeam === 'NIL'} />
                                                            </div>
                                                            <div className="w-full md:w-1/3">
                                                                <label className="block text-sm font-bold text-orange-800 mb-1">Class</label>
                                                                <select className="w-full border p-2 rounded bg-white" value={thirdPlaceClass} onChange={(e) => setThirdPlaceClass(e.target.value)} disabled={thirdPlaceTeam === 'NIL'}>
                                                                    <option value="">-Select Class-</option>
                                                                    {studentClasses.map(c => <option key={c} value={c}>{c}</option>)}
                                                                </select>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <button type="submit" className="w-full bg-blue-900 text-white font-bold py-3 rounded-lg hover:bg-blue-800 transition">SUBMIT RESULT & UPDATE SCORE</button>
                                                </form>
                                            </div>

                                            {/* MANAGE RESULTS SECTION (DELETE / RESET) */}
                                            <div className="bg-white p-6 rounded-lg border border-red-200 shadow-sm">
                                                <div className="flex justify-between items-center mb-4 border-b pb-2">
                                                    <h3 className="text-xl font-bold text-red-700">Manage Data (Delete / Refresh)</h3>
                                                    <button type="button" onClick={handleResetAll} className="bg-red-600 text-white font-bold py-2 px-4 rounded hover:bg-red-700 transition shadow">
                                                        ⚠️ Reset All Scores & Data
                                                    </button>
                                                </div>
                                                
                                                {results.length === 0 ? (
                                                    <p className="text-gray-500 text-sm">No results to manage.</p>
                                                ) : (
                                                    <div className="space-y-3 mt-4">
                                                        {results.map(res => (
                                                            <div key={res.id} className="flex justify-between items-center bg-gray-50 p-3 border rounded shadow-sm">
                                                                <div>
                                                                    <span className="font-bold text-gray-800 uppercase">{res.game}</span> 
                                                                    <span className="text-sm text-gray-600 ml-2">({res.category} - {res.group})</span>
                                                                </div>
                                                                <button onClick={() => handleDeleteResult(res.id)} className="bg-red-500 text-white px-4 py-1.5 rounded text-sm font-bold hover:bg-red-600 shadow">
                                                                    Delete Entry
                                                                </button>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AerionSports />);
    </script>
</body>
</html>
